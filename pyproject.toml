[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cassandra-log-hub"
version = "0.1.0"
description = "Centralized search, filtering and tailing of distributed Cassandra logs with Fluent Bit and OpenSearch"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Kush Gupta" }]
license = { text = "MIT" }
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
logq = "loghub.cli:main"

[tool.setuptools]
packages = ["loghub"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Test fixtures quote real Cassandra log lines, which are long.
"tests/*" = ["E501"]
