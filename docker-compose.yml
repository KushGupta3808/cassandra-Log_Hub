# Cassandra Log Hub: a 3-node Cassandra cluster whose logs are collected by
# Fluent Bit, indexed in OpenSearch and explored in OpenSearch Dashboards or
# with the `logq` command-line tool.
#
# Memory: the whole stack needs roughly 5-6 GB of RAM available to Docker.

x-cassandra-common: &cassandra-common
  image: cassandra:4.1
  restart: unless-stopped
  environment: &cassandra-env
    CASSANDRA_CLUSTER_NAME: loghub-cluster
    CASSANDRA_SEEDS: cassandra-1
    CASSANDRA_DC: dc1
    CASSANDRA_RACK: rack1
    CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
    MAX_HEAP_SIZE: 512M
    HEAP_NEWSIZE: 128M
  healthcheck:
    test: ["CMD-SHELL", "nodetool status | grep -q '^UN'"]
    interval: 15s
    timeout: 10s
    retries: 20
  networks: [loghub]

services:
  cassandra-1:
    <<: *cassandra-common
    container_name: cassandra-1
    hostname: cassandra-1
    volumes:
      - cass1-data:/var/lib/cassandra
      - cass1-logs:/var/log/cassandra

  cassandra-2:
    <<: *cassandra-common
    container_name: cassandra-2
    hostname: cassandra-2
    depends_on:
      cassandra-1:
        condition: service_healthy
    volumes:
      - cass2-data:/var/lib/cassandra
      - cass2-logs:/var/log/cassandra

  cassandra-3:
    <<: *cassandra-common
    container_name: cassandra-3
    hostname: cassandra-3
    depends_on:
      cassandra-2:
        condition: service_healthy
    volumes:
      - cass3-data:/var/lib/cassandra
      - cass3-logs:/var/log/cassandra

  opensearch:
    image: opensearchproject/opensearch:2.15.0
    container_name: opensearch
    environment:
      discovery.type: single-node
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
      # Local development only: no TLS or authentication.
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    ports:
      - "9200:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks: [loghub]

  dashboards:
    image: opensearchproject/opensearch-dashboards:2.15.0
    container_name: dashboards
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    ports:
      - "5601:5601"
    depends_on:
      opensearch:
        condition: service_healthy
    networks: [loghub]

  # One-shot: index template + retention policy, before any logs are written.
  opensearch-init:
    image: curlimages/curl:8.10.1
    container_name: opensearch-init
    entrypoint: ["/bin/sh", "/init/opensearch-init.sh"]
    volumes:
      - ./opensearch:/init:ro
    depends_on:
      opensearch:
        condition: service_healthy
    networks: [loghub]

  # One-shot: index pattern in Dashboards so Discover opens onto the logs.
  dashboards-init:
    image: curlimages/curl:8.10.1
    container_name: dashboards-init
    entrypoint: ["/bin/sh", "/init/dashboards-init.sh"]
    volumes:
      - ./opensearch:/init:ro
    depends_on:
      - dashboards
    networks: [loghub]

  fluent-bit:
    image: fluent/fluent-bit:3.1
    container_name: fluent-bit
    volumes:
      - ./fluent-bit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - ./fluent-bit/parsers.conf:/fluent-bit/etc/parsers.conf:ro
      - cass1-logs:/logs/cassandra-1:ro
      - cass2-logs:/logs/cassandra-2:ro
      - cass3-logs:/logs/cassandra-3:ro
      - fluent-bit-state:/fluent-bit/state
    depends_on:
      opensearch-init:
        condition: service_completed_successfully
    networks: [loghub]

networks:
  loghub:

volumes:
  cass1-data:
  cass2-data:
  cass3-data:
  cass1-logs:
  cass2-logs:
  cass3-logs:
  opensearch-data:
  fluent-bit-state:
