# Fluent Bit pipeline: tail each Cassandra node's system.log, stitch Java stack
# traces back onto the line that produced them, parse each entry into fields,
# tag it with the node it came from, and index it in OpenSearch.

[SERVICE]
    Flush             2
    Log_Level         info
    Parsers_File      parsers.conf
    HTTP_Server       On
    HTTP_Listen       0.0.0.0
    HTTP_Port         2020
    storage.path      /fluent-bit/state/buffer

# ---- Inputs: one per node, so every record carries its node name ----

[INPUT]
    Name              tail
    Tag               cassandra.cassandra-1
    Path              /logs/cassandra-1/system.log
    DB                /fluent-bit/state/cassandra-1.db
    Read_from_Head    On
    Refresh_Interval  5
    multiline.parser  cassandra_multiline

[INPUT]
    Name              tail
    Tag               cassandra.cassandra-2
    Path              /logs/cassandra-2/system.log
    DB                /fluent-bit/state/cassandra-2.db
    Read_from_Head    On
    Refresh_Interval  5
    multiline.parser  cassandra_multiline

[INPUT]
    Name              tail
    Tag               cassandra.cassandra-3
    Path              /logs/cassandra-3/system.log
    DB                /fluent-bit/state/cassandra-3.db
    Read_from_Head    On
    Refresh_Interval  5
    multiline.parser  cassandra_multiline

# ---- Filters ----

# Split the raw line into level, thread, timestamp, source file, line number
# and message. Keep the raw line if a record does not match the pattern.
[FILTER]
    Name              parser
    Match             cassandra.*
    Key_Name          log
    Parser            cassandra_log
    Reserve_Data      On
    Preserve_Key      Off

# Add the node name and cluster name to every record.
[FILTER]
    Name              record_modifier
    Match             cassandra.cassandra-1
    Record            node cassandra-1
    Record            cluster loghub-cluster

[FILTER]
    Name              record_modifier
    Match             cassandra.cassandra-2
    Record            node cassandra-2
    Record            cluster loghub-cluster

[FILTER]
    Name              record_modifier
    Match             cassandra.cassandra-3
    Record            node cassandra-3
    Record            cluster loghub-cluster

# ---- Output: daily indices named cassandra-logs-YYYY.MM.DD ----

[OUTPUT]
    Name                opensearch
    Match               cassandra.*
    Host                opensearch
    Port                9200
    Logstash_Format     On
    Logstash_Prefix     cassandra-logs
    Suppress_Type_Name  On
    Replace_Dots        On
    Trace_Error         On
    Retry_Limit         False
