# Cassandra writes system.log lines like:
#   INFO  [main] 2026-11-09 18:42:07,513 StorageService.java:1645 - JOINING: waiting for ring information
# Exceptions add Java stack-trace lines underneath, which belong to the entry above.

# A new entry starts with a log level followed by a [thread]; every other line
# (stack frames, "Caused by:", wrapped text) continues the current entry.
[MULTILINE_PARSER]
    name          cassandra_multiline
    type          regex
    flush_timeout 1000
    rule      "start_state"   "/^(TRACE|DEBUG|INFO|WARN|ERROR)\s+\[/"                 "cont"
    rule      "cont"          "/^(?!(TRACE|DEBUG|INFO|WARN|ERROR)\s+\[)/"              "cont"

# Splits one (possibly multi-line) entry into fields. [\s\S]* lets the message
# include the stack trace lines joined by the multiline parser.
[PARSER]
    Name          cassandra_log
    Format        regex
    Regex         ^(?<level>TRACE|DEBUG|INFO|WARN|ERROR)\s+\[(?<thread>[^\]]+)\]\s+(?<time>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2},\d{3})\s+(?<source>[^:\s]+):(?<line>\d+)\s+-\s+(?<message>[\s\S]*)$
    Time_Key      time
    Time_Format   %Y-%m-%d %H:%M:%S,%L
    Time_Keep     Off
    Types         line:integer
